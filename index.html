<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 제조실적 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: sans-serif; background-color: #0f172a; color: #f1f5f9; }</style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        <!-- 상단 헤더 -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-slate-900 p-6 rounded-2xl border border-slate-800">
            <div>
                <h1 class="text-xl font-bold text-white">팀 제조실적 관리</h1>
                <p class="text-sm text-slate-400">마약 생산 데이터 기록 시스템</p>
            </div>
            <div class="flex gap-2 mt-4 md:mt-0">
                <button onclick="showTab('entry')" class="px-4 py-2 bg-emerald-600 rounded-lg text-sm font-bold">제조량 입력</button>
                <button onclick="showTab('ranking')" class="px-4 py-2 bg-slate-800 rounded-lg text-sm font-bold">주간 순위</button>
                <button onclick="showTab('members')" class="px-4 py-2 bg-slate-800 rounded-lg text-sm font-bold">팀원 관리</button>
            </div>
        </div>

        <!-- 탭 내용 -->
        <div id="contentArea" class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
            <!-- 기본 탭: 제조량 입력 -->
            <div id="tab-entry" class="space-y-4">
                <h2 class="font-bold text-lg">기록할 기간 선택 (2026년)</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="text-xs text-slate-400">시작일</label>
                        <input type="date" id="startDate" min="2026-01-01" max="2026-12-31" class="w-full bg-slate-800 p-2 rounded border border-slate-700">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">종료일</label>
                        <input type="date" id="endDate" min="2026-01-01" max="2026-12-31" class="w-full bg-slate-800 p-2 rounded border border-slate-700">
                    </div>
                    <button onclick="initPeriod()" class="bg-blue-600 hover:bg-blue-500 rounded-lg font-bold">기간 설정 완료</button>
                </div>
                <div id="tableContainer" class="overflow-x-auto mt-4">
                    <table class="w-full text-left border-collapse">
                        <thead class="text-slate-400 text-xs uppercase border-b border-slate-700">
                            <tr><th class="p-3">닉네임</th><th class="p-3">대마</th><th class="p-3">코카</th><th class="p-3">LSD</th></tr>
                        </thead>
                        <tbody id="memberRows"></tbody>
                    </table>
                </div>
            </div>

            <!-- 팀원 관리 탭 -->
            <div id="tab-members" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h2 id="memberCountText" class="font-bold text-lg">팀원 명단 (총 0명)</h2>
                    <div class="flex gap-2">
                        <input type="text" id="newMemberName" placeholder="닉네임" class="bg-slate-800 p-2 rounded border border-slate-700">
                        <button onclick="addMember()" class="bg-emerald-600 px-4 py-2 rounded font-bold">추가</button>
                    </div>
                </div>
                <ul id="memberList" class="space-y-2"></ul>
            </div>
            
            <!-- 순위 탭 -->
            <div id="tab-ranking" class="hidden">
                <h2 class="font-bold text-lg mb-4">주간 생산 순위</h2>
                <div id="rankingList" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('cartelData')) || { members: [], records: {} };

        function updateUI() {
            // 팀원 관리 탭 업데이트
            document.getElementById('memberCountText').innerText = `팀원 명단 (총 ${db.members.length}명)`;
            const list = document.getElementById('memberList');
            list.innerHTML = db.members.map(m => `
                <li class="bg-slate-800 p-3 rounded flex justify-between">
                    ${m} <button onclick="removeMember('${m}')" class="text-red-400">삭제</button>
                </li>`).join('');
            
            // 제조량 입력 테이블 업데이트
            const rows = document.getElementById('memberRows');
            rows.innerHTML = db.members.map(m => `
                <tr class="border-b border-slate-800">
                    <td class="p-3">${m}</td>
                    <td><input type="number" class="w-16 bg-slate-800 p-1 rounded"></td>
                    <td><input type="number" class="w-16 bg-slate-800 p-1 rounded"></td>
                    <td><input type="number" class="w-16 bg-slate-800 p-1 rounded"></td>
                </tr>`).join('');
        }

        function addMember() {
            const name = document.getElementById('newMemberName').value;
            if (name && !db.members.includes(name)) {
                db.members.push(name);
                save(); updateUI();
            }
        }

        function removeMember(name) {
            db.members = db.members.filter(m => m !== name);
            save(); updateUI();
        }

        function save() { localStorage.setItem('cartelData', JSON.stringify(db)); }
        
        function showTab(tab) {
            document.getElementById('tab-entry').classList.add('hidden');
            document.getElementById('tab-ranking').classList.add('hidden');
            document.getElementById('tab-members').classList.add('hidden');
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
        }

        updateUI();
    </script>
</body>
</html>
